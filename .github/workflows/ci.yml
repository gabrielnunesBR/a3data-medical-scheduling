name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check repository formatting
        run: npx --no-install prettier . --check

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Type-check frontend tooling
        run: |
          npm exec --workspace=frontend -- \
            tsc -p tsconfig.node.json --noEmit

      - name: Test backend
        run: npm run test --workspace=backend -- --run

      - name: Test frontend
        run: npm run test --workspace=frontend -- --run

      - name: Build backend and frontend
        run: npm run build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medical_app
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: medical_scheduling_test

        ports:
          - 5434:5432

        options: >-
          --health-cmd "pg_isready -U medical_app -d medical_scheduling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env.test <<'EOF'
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5434
          POSTGRES_DB=medical_scheduling_test
          POSTGRES_USER=medical_app
          POSTGRES_PASSWORD=ci-local-only
          EOF

          chmod 600 .env.test

      - name: Apply database migrations
        run: npm run migration:run --workspace=backend
        env:
          NODE_ENV: test

      - name: Seed exams
        run: npm run seed:exams --workspace=backend
        env:
          NODE_ENV: test

      - name: Seed doctors
        run: npm run seed:doctors --workspace=backend
        env:
          NODE_ENV: test

      - name: Run backend E2E tests
        run: npm run test:e2e --workspace=backend -- --run
        env:
          NODE_ENV: test

      - name: Install Playwright Chromium
        run: |
          npm exec --workspace=frontend -- \
            playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          npm run test:browser --workspace=frontend -- \
            --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
