server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        # Preserve /api in the request URI (no trailing slash after :3000).
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite untrusted incoming forwarded headers; exactly one proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Only the root path is a valid page in this single-page application.
    # Serve the React shell with HTTP 404 for unknown paths; React renders
    # the branded not-found screen. Existing static assets keep working.
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
